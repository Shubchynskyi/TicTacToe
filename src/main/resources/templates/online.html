<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language == 'ua' ? 'uk' : #locale.language}">
<head th:replace="~{fragments/head :: headFrag('online.title')}"></head>
<body>
<div th:replace="~{fragments/header :: headerFrag}"></div>
<main class="app-main lobby-main container">
    <div class="lobby-heading"><div><h1 class="page-heading" th:text="#{online.heading}">Online games</h1><p class="lobby-description" th:text="#{ui.onlineDescription}">Find an opponent or invite a friend to your game.</p></div><form action="/create-online" method="post"><button class="button is-primary btn-w200 mt-05" type="submit" th:text="#{online.createGame}">Create new game</button></form></div>
    <input type="hidden" id="userIdHidden" th:value="${session.userId}">
    <div id="lobbyEmpty" class="lobby-empty" th:hidden="${!#lists.isEmpty(games)}"><h2 th:text="#{ui.emptyHeading}">No open games</h2><p th:text="#{ui.emptyDescription}">Create a game and invite another player.</p></div>
    <div id="gameList" class="game-list" aria-live="polite">
        <article th:each="g : ${games}" class="box game-row">
            <div class="game-col col-id"><strong th:text="#{ui.room}">Room</strong><span th:text="${g.gameId}">1</span></div>
            <div class="game-col col-x"><strong th:text="#{online.playerX}">Player X</strong><span th:classappend="${session.userId == g.playerXId} ? 'has-text-weight-bold' : ''" th:text="${g.playerXDisplay}">X</span></div>
            <div class="game-col col-o"><strong th:text="#{online.playerO}">Player O</strong><span th:classappend="${session.userId == g.playerOId} ? 'has-text-weight-bold' : ''" th:text="${g.playerODisplay}">O</span></div>
            <div class="game-col col-status"><strong th:text="#{online.status}">Status</strong><span class="status-pill" th:classappend="${g.waitingForSecondPlayer} ? 'is-waiting' : ''" th:text="${g.waitingForSecondPlayer} ? #{online.waiting} : #{online.inProgress}">Waiting</span></div>
            <div class="game-col col-action"><a th:if="${session.userId == g.playerXId || session.userId == g.playerOId}" class="button is-link btn-w100" th:href="@{/onlineGame(gameId=${g.gameId})}" th:text="#{online.go}">Go</a><a th:if="${g.waitingForSecondPlayer && !(session.userId == g.playerXId || session.userId == g.playerOId)}" class="button is-info btn-w100" th:href="@{/join-online(gameId=${g.gameId})}" th:text="#{online.join}">Join</a><span th:if="${!g.waitingForSecondPlayer && !(session.userId == g.playerXId || session.userId == g.playerOId)}" class="status-pill" th:text="#{online.gameInProgress}">In progress</span></div>
        </article>
    </div>
    <div class="button-group lobby-actions"><a class="button is-link btn-w200" href="/" th:text="#{online.goToHome}">Back to mode selection</a><button class="button is-info btn-w200" type="button" onclick="forceRefresh()" th:text="#{online.refresh}">Refresh game list</button></div>
</main>
<div id="i18nOnline" hidden th:attr="data-waiting=#{online.waiting},data-progress=#{online.inProgress},data-go=#{online.go},data-join=#{online.join},data-inprogress=#{online.gameInProgress},data-room=#{ui.room},data-player-x=#{online.playerX},data-player-o=#{online.playerO},data-status=#{online.status}"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/online.js(v='20261004-3')}"></script>
</body>
</html>
