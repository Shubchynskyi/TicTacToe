<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language == 'ua' ? 'uk' : #locale.language}">
<head th:replace="~{fragments/head :: headFrag('onlineGame.title')}"></head>
<body>
<div th:replace="~{fragments/header :: headerFrag}"></div>
<main class="app-main play-main">
    <div class="play-heading"><h1 class="page-heading"><span th:text="#{onlineGame.heading}">Online game #</span><span id="gameId"></span></h1></div>
    <input type="hidden" id="userIdHidden" th:value="${session.userId}">
    <section class="play-card" th:attr="aria-label=#{ui.board}">
        <div class="player-summary"><span><span th:text="#{onlineGame.yourNick}">Your nickname:</span> <span id="nick" th:text="${nick}">Guest</span></span><span><span th:text="#{onlineGame.yourSymbol}">Your symbol:</span> <strong id="yourSymbol"></strong></span></div>
        <div class="score-grid online-scores"><p class="score-tile"><span class="score-label"><span th:text="#{onlineGame.playerX}">Player X</span><span id="playerX">X</span></span><span id="scoreX" class="score-number">0</span></p><p class="score-tile"><span class="score-label"><span th:text="#{onlineGame.playerO}">Player O</span><span id="playerO">O</span></span><span id="scoreO" class="score-number">0</span></p></div>
        <p id="turnInfoEl" class="turn-status" role="status" aria-live="polite"></p>
        <div class="game-container"><div th:replace="~{fragments/board :: boardFrag}"></div><button id="rematchBtn" class="button is-warning" onclick="rematch()" th:text="#{onlineGame.rematch}">Rematch</button></div>
        <div class="button-group"><button class="button is-danger btn-w200" onclick="showCreatorLeaveModal()" th:text="#{onlineGame.leave}">Leave the game</button><a class="button is-link btn-w200" href="/online" th:text="#{onlineGame.backToList}">Back to list</a></div>
    </section>
</main>
<div id="timeLeft30Modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="timeLeftHeading"><div class="modal-content"><h3 id="timeLeftHeading" th:text="#{onlineGame.timeLeft}">30 seconds left!</h3><p th:text="#{onlineGame.continueOrLeave}">You can continue or leave.</p><div class="modal-btn-col"><button class="button is-primary btn-w200" onclick="closeTimeLeft30Modal()" th:text="#{onlineGame.continue}">Continue</button><button class="button is-danger btn-w200" onclick="leaveCurrentGame()" th:text="#{onlineGame.leave}">Leave</button></div></div></div>
<div id="sessionClosedModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="sessionClosedHeading"><div class="modal-content"><h3 id="sessionClosedHeading" th:text="#{onlineGame.sessionClosed}">Session closed</h3><p><span th:text="#{onlineGame.returnIn}">Returning in</span> <span id="closeTimer">5</span> <span th:text="#{onlineGame.seconds}">seconds...</span></p><div class="modal-btn-col"><button class="button is-info btn-w200" onclick="goToListNow()" th:text="#{onlineGame.exitNow}">Exit now</button></div></div></div>
<div id="creatorLeaveModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="creatorLeaveHeading"><div class="modal-content"><h3 id="creatorLeaveHeading" th:text="#{onlineGame.leaveGame}">Leaving the game</h3><p th:text="#{onlineGame.areYouSure}">Are you sure?</p><div class="modal-btn-col"><button class="button is-danger btn-w200" onclick="confirmCreatorLeave()" th:text="#{onlineGame.leave}">Leave</button><button class="button btn-w200" onclick="cancelCreatorLeave()" th:text="#{onlineGame.cancel}">Cancel</button></div></div></div>
<div id="i18nOnlineGame" hidden th:attr="data-your-turn=#{onlineGame.yourTurn},data-waiting=#{online.waiting},data-wait-x=#{onlineGame.waitPlayerX},data-wait-o=#{onlineGame.waitPlayerO},data-draw=#{onlineGame.draw},data-winner=#{onlineGame.winner}"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/onlineGame.js}"></script>
</body>
</html>
