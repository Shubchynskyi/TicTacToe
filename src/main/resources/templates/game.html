<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language == 'ua' ? 'uk' : #locale.language}">
<head th:replace="~{fragments/head :: headFrag('game.title')}"></head>
<body>
<div th:replace="~{fragments/header :: headerFrag}"></div>
<main class="app-main play-main">
    <div class="play-heading"><h1 class="page-heading" th:text="#{ui.gameName}">TicTacToe</h1></div>
    <section class="play-card" th:attr="aria-label=#{ui.board}">
        <div id="scorePanel"><div class="score-grid"><p class="score-tile"><span class="score-label" th:text="#{game.scorePlayer}">Your score:</span><span id="scoreHuman" class="score-number">0</span></p><p class="score-tile"><span class="score-label" th:text="#{game.scoreAI}">Computer:</span><span id="scoreAI" class="score-number">0</span></p></div></div>
        <p id="status" class="turn-status" role="status" aria-live="polite" th:text="#{game.status}">Status:</p>
        <div th:replace="~{fragments/board :: boardFrag}"></div>
        <div class="button-group"><button class="button is-primary btn-w200" id="restartBtn" onclick="restartLocal()" th:text="#{game.restart}">Play again</button><a class="button btn-w200" href="/" th:text="#{game.goHome}">Back to Home</a></div>
    </section>
</main>
<div id="i18nLocalGame" hidden th:attr="data-turn=#{game.turn},data-winner=#{game.winner},data-draw=#{game.draw},data-restart=#{game.restart}"></div>
<script th:src="@{/js/localGame.js(v='20261004-2')}"></script>
</body>
</html>
